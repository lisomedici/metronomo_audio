<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playback con cuenta</title>
    <link rel="stylesheet" href="styles.css?v=5">
  </head>
  <body>
    <main class="app-shell">
      <section class="transport" aria-label="Playback con cuenta de metrónomo">
        <div class="topbar">
          <div>
            <p class="eyebrow">Playback local</p>
            <h1>Cuenta y arranque</h1>
          </div>
          <div class="status-pill" id="statusPill">Sin audio</div>
        </div>

        <div class="tabs" role="tablist" aria-label="Herramientas">
          <button class="tab-button is-active" id="playbackTab" type="button" role="tab" aria-selected="true" aria-controls="playbackPanel">
            Playback
          </button>
          <button class="tab-button" id="lyricsTab" type="button" role="tab" aria-selected="false" aria-controls="lyricsPanel">
            Letra
          </button>
        </div>

        <div class="tab-panel is-active" id="playbackPanel" role="tabpanel" aria-labelledby="playbackTab">
          <div class="stage">
            <div class="beat-orb" id="beatOrb" aria-live="polite">
              <span id="countDisplay">0</span>
            </div>
            <div class="track-meta">
              <p id="trackName">Cargá un archivo MP3, WAV, M4A u OGG</p>
              <div class="progress-wrap" aria-label="Progreso del audio">
                <div class="progress-bar" id="progressBar"></div>
              </div>
              <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
              </div>
            </div>
          </div>

          <div class="controls-grid">
            <label class="file-drop" for="audioFile">
              <input id="audioFile" type="file" accept="audio/*">
              <span class="file-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M9 18V5l10-2v13"></path>
                  <circle cx="7" cy="18" r="3"></circle>
                  <circle cx="17" cy="16" r="3"></circle>
                </svg>
              </span>
              <span>Elegir audio</span>
            </label>

            <label class="field">
              <span>BPM</span>
              <input id="bpmInput" type="number" min="40" max="260" value="120" inputmode="numeric">
            </label>

            <label class="field">
              <span>Cuenta</span>
              <select id="countInSelect">
                <option value="3" selected>3 tiempos</option>
                <option value="4">4 tiempos</option>
                <option value="8">8 tiempos</option>
                <option value="2">2 tiempos</option>
                <option value="1">1 tiempo</option>
              </select>
            </label>

            <label class="field">
              <span>Click</span>
              <input id="clickVolume" type="range" min="0" max="100" value="70">
            </label>
          </div>

          <div class="actions">
            <button class="primary-action" id="startButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7z"></path>
              </svg>
              Iniciar
            </button>
            <button class="ghost-action" id="stopButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="1"></rect>
              </svg>
              Detener
            </button>
            <button class="ghost-action" id="lightButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
              </svg>
              Modo luz
            </button>
          </div>
        </div>

        <div class="tab-panel" id="lyricsPanel" role="tabpanel" aria-labelledby="lyricsTab" hidden>
          <div class="lyrics-workspace">
            <label class="lyrics-box">
              <span>Letra original</span>
              <textarea id="lyricsInput" spellcheck="false" placeholder="Pegá acá la letra con mayúsculas"></textarea>
            </label>

            <label class="lyrics-box">
              <span>Letra en minúsculas</span>
              <textarea id="lyricsOutput" spellcheck="false" readonly placeholder="Acá va a aparecer lista para subtítulos"></textarea>
            </label>
          </div>

          <div class="lyrics-actions">
            <button class="primary-action compact-action" id="lowercaseButton" type="button">Pasar a minúsculas</button>
            <button class="ghost-action compact-action" id="copyLyricsButton" type="button">Copiar</button>
            <button class="ghost-action compact-action" id="clearLyricsButton" type="button">Limpiar</button>
            <span class="lyrics-status" id="lyricsStatus" aria-live="polite"></span>
          </div>
        </div>
      </section>
    </main>

    <div class="light-overlay" id="lightOverlay" hidden>
      <div class="lava" aria-hidden="true">
        <span class="blob blob-dark"></span>
        <span class="blob blob-yellow"></span>
        <span class="blob blob-yellow-small"></span>
        <span class="blob blob-orange"></span>
        <span class="blob blob-orange-small"></span>
      </div>
      <div class="light-hud">
        <span id="lightStatus">Sin audio</span>
        <span class="light-count" id="lightCount">0</span>
        <label class="light-level-label" for="lightLevel">Brillo</label>
        <input class="light-slider" id="lightLevel" type="range" min="60" max="200" step="5" value="100" aria-label="Intensidad de la luz">
        <span class="light-hint">Espacio: iniciar/detener · P: congelar · ↑↓: brillo · Esc: salir</span>
        <button type="button" id="lightFreezeButton">Congelar</button>
        <button type="button" id="lightExitButton">Salir</button>
      </div>
    </div>

    <script src="app.js?v=5"></script>
  </body>
</html>
